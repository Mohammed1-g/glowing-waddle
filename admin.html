<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - مزرت ماجد</title>
    <!-- استدعاء مكاتب فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f5; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        .header { background: #d32f2f; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .stats { display: flex; justify-content: space-between; background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        
        .order-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-right: 5px solid #27ae60; }
        .order-card h4 { margin: 0 0 10px 0; color: #2c3e50; }
        .order-info { display: grid; grid-template-columns: 1fr 1fr; font-size: 14px; gap: 5px; }
        .price-tag { font-size: 18px; color: #27ae60; font-weight: bold; margin-top: 10px; text-align: left; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; float: left; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>لوحة تحكم الإدارة (مباشر) 🟢</h1>
        </div>

        <div class="stats">
            <span>عدد الطلبات اليوم: <span id="totalOrdersCount" style="color:#d32f2f;">0</span></span>
            <span>المبيعات الكلية: <span id="totalSales" style="color:#27ae60;">0</span> دينار</span>
        </div>

        <div id="ordersContainer">
            <h3 style="text-align: center; color: #777;">جاري جلب الطلبات...</h3>
        </div>
    </div>

    <script>
        // --- 1. إعدادات فايربيس (يجب أن تكون مطابقة لملف العامل) ---
        const firebaseConfig = {
            apiKey: "ضع_مفتاحك_هنا",
            authDomain: "مشروعك.firebaseapp.com",
            databaseURL: "https://مشروعك-default-rtdb.firebaseio.com",
            projectId: "مشروعك",
            storageBucket: "مشروعك.appspot.com",
            messagingSenderId: "رقم",
            appId: "معرف_التطبيق"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- 2. الاستماع للبيانات لحظياً (Real-time) ---
        const ordersRef = database.ref('orders');
        
        // هذه الدالة تعمل تلقائياً كلما تم إضافة، حذف، أو تعديل طلب في السحابة
        ordersRef.on('value', (snapshot) => {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';
            
            let count = 0;
            let total = 0;

            // جلب البيانات وعكس الترتيب (الجديد أولاً)
            const orders = [];
            snapshot.forEach((childSnapshot) => {
                orders.push({ id: childSnapshot.key, ...childSnapshot.val() });
            });
            orders.reverse(); 

            if(orders.length === 0) {
                container.innerHTML = '<h3 style="text-align:center;">لا توجد طلبات حالياً.</h3>';
            }

            orders.forEach(order => {
                count++;
                total += parseFloat(order.price);

                const card = `
                    <div class="order-card">
                        <h4>👤 ${order.name} - 📞 ${order.phone}</h4>
                        <div class="order-info">
                            <span>🍗 الصنف: <strong>${order.category}</strong></span>
                            <span>📅 التاريخ: ${order.date}</span>
                            <span>⚖️ الوزن: ${order.quantity} | 🔢 العدد: ${order.count}</span>
                            <span>💰 سعر الكيلو: ${order.unitPrice}</span>
                        </div>
                        <div class="price-tag">
                            الإجمالي: ${order.price} دينار
                            <button class="btn-delete" onclick="deleteOrder('${order.id}')">حذف</button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            // تحديث الإحصائيات
            document.getElementById('totalOrdersCount').innerText = count;
            document.getElementById('totalSales').innerText = total;
        });

        // --- 3. حذف الطلب من السحابة ---
        function deleteOrder(id) {
            if(confirm("هل تريد حذف هذا الطلب نهائياً من النظام؟")) {
                database.ref('orders/' + id).remove();
            }
        }
    </script>
</body>
</html>
