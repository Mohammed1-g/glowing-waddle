<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرت ماجد - نقطة البيع (الكاشير)</title>
    <!-- استدعاء مكاتب فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* ... نفس الـ CSS السابق تماماً للتصميم ... */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #d32f2f; outline: none; }
        .btn-save { width: 100%; padding: 12px; background: #d32f2f; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top:10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center; color: #d32f2f;">نقطة بيع - مزرت ماجد 🍗</h2>
        
        <div class="grid-form">
            <div class="form-group full-width">
                <label>اسم الزبون:</label>
                <input type="text" id="customerName" placeholder="أدخل اسم الزبون..." required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="customerPhone" placeholder="07700000000" required>
            </div>

            <div class="form-group">
                <label>تاريخ الطلب:</label>
                <input type="date" id="orderDate" required>
            </div>

            <div class="form-group">
                <label>الصنف:</label>
                <select id="itemCategory" onchange="updatePrice()">
                    <option value="" disabled selected>اختر...</option>
                    <option value="صدر دجاج" data-price="5000">صدر دجاج</option>
                    <option value="أجنحة" data-price="5000">أجنحة</option>
                    <option value="دجاج" data-price="3000">دجاج</option>
                    <option value="أفخاذ" data-price="5000">أفخاذ</option>
                    <option value="كبدة" data-price="4000">كبدة</option>
                    <option value="حواصل" data-price="5000">حواصل</option>
                </select>
            </div>

            <div class="form-group">
                <label>سعر الكيلو:</label>
                <input type="number" id="unitPrice" oninput="calcTotal()" required>
            </div>

            <div class="form-group">
                <label>الوزن:</label>
                <input type="number" id="itemQuantity" step="0.25" value="1" oninput="calcTotal()">
            </div>

            <div class="form-group">
                <label>العدد:</label>
                <input type="number" id="itemCount" value="1" oninput="calcTotal()">
            </div>

            <div class="form-group full-width">
                <label>السعر الإجمالي:</label>
                <input type="number" id="totalPrice" readonly style="background:#e8f5e9; color:#27ae60; font-weight:bold;">
            </div>
        </div>

        <button class="btn-save" onclick="saveOrderToCloud()">إرسال الطلب للإدارة 🚀</button>
    </div>

    <script>
        // --- 1. إعدادات فايربيس (ضع معلوماتك هنا) ---
        const firebaseConfig = {
            apiKey: "ضع_مفتاحك_هنا",
            authDomain: "مشروعك.firebaseapp.com",
            databaseURL: "https://مشروعك-default-rtdb.firebaseio.com",
            projectId: "مشروعك",
            storageBucket: "مشروعك.appspot.com",
            messagingSenderId: "رقم",
            appId: "معرف_التطبيق"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.getElementById('orderDate').valueAsDate = new Date();

        function updatePrice() {
            const sel = document.getElementById('itemCategory');
            document.getElementById('unitPrice').value = sel.options[sel.selectedIndex].dataset.price;
            calcTotal();
        }

        function calcTotal() {
            const p = parseFloat(document.getElementById('unitPrice').value) || 0;
            const q = parseFloat(document.getElementById('itemQuantity').value) || 0;
            const c = parseInt(document.getElementById('itemCount').value) || 0;
            document.getElementById('totalPrice').value = p * q * c;
        }

        // --- 2. رفع البيانات للسحابة ---
        function saveOrderToCloud() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            if(!name || !phone) { alert("أكمل البيانات!"); return; }

            const orderData = {
                name: name,
                phone: phone,
                date: document.getElementById('orderDate').value,
                category: document.getElementById('itemCategory').value,
                unitPrice: document.getElementById('unitPrice').value,
                quantity: document.getElementById('itemQuantity').value,
                count: document.getElementById('itemCount').value,
                price: document.getElementById('totalPrice').value,
                timestamp: firebase.database.ServerValue.TIMESTAMP // وقت السيرفر الدقيق
            };

            // دفع البيانات لعقدة "orders"
            database.ref('orders').push(orderData).then(() => {
                alert("تم إرسال الطلب للإدارة بنجاح ✅");
                location.reload(); // تفريغ الحقول
            }).catch((error) => {
                alert("خطأ في الاتصال: " + error.message);
            });
        }
    </script>
</body>
</html>
